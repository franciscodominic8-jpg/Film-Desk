name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners already include the Android SDK.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug and release APKs
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --continue 2>&1 | tee build.log

      # On failure, show the compiler errors as annotations on the run page.
      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: " build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/app/src/main/java/com/filmdesk/app/##' | head -10 | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -A3 "What went wrong" build.log | head -12 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::warning::$line"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: FilmDesk-apk
          path: app/build/outputs/apk/**/*.apk
